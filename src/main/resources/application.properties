spring.application.name=comandas
# Local development: spring-dotenv reads a git-ignored .env file from the working directory.
# In production the variables come from the container environment (.env of the app on the server).
spring.jackson.time-zone=America/Sao_Paulo

# ===============================
# DATABASE
# The password has no default: the application refuses to start without it.
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/comandas}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
server.port=${SERVER_PORT:9091}

# ===============================
# JPA / HIBERNATE
# ===============================
# The schema belongs to Flyway (CMD-016). With the platform starter there is no schema to validate at startup, because
# tenant schemas appear later; MigrationConvergenceTest proves that the migrations match the entities.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# FLYWAY + HOSTING PLATFORM (CMD-016)
# ===============================
# The platform starter forces spring.flyway.enabled=false and runs these migrations itself, once per tenant schema
# (or in `public` when CENTRAL_MODE=off, the own instance). The scripts must not qualify the schema.
# Databases created by the old ddl-auto=update are baselined at V1 (the baseline script) and receive V2+.
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Controllers map entities to responses outside a transaction (lazy associations), so the app needs a session while
# the response is built. The platform registers an open-session-in-view that is safe with tenants.
platform.open-in-view=true

# ===============================
# INITIAL ADMINISTRATOR (own instance only)
# ===============================
# Only used when no "admin" user exists yet. Blank = the admin user is not created. In the hosted mode the
# administrator is created by the tenant provisioning, from the e-mail of the customer.
comandas.admin.initial-password=${APP_ADMIN_PASSWORD:}

# ===============================
# JWT (CMD-015)
# ===============================
# No default on purpose: the application refuses to start without a secret.
# Use one distinct random value (>= 32 characters) per instance.
api.security.token.secret=${JWT_SECRET}
api.jwt.expiration=7
api.jwt.expiration.recovery.password=1

springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://localhost:*,https://127.0.0.1:*}

# ===============================
# WEB PUSH (VAPID)
# ===============================
# Generate one key pair per instance with `npx web-push generate-vapid-keys` and
# expose it through the environment. Blank keeps push disabled (no error).
push.vapid.public-key=${PUSH_VAPID_PUBLIC_KEY:}
push.vapid.private-key=${PUSH_VAPID_PRIVATE_KEY:}
push.vapid.subject=${PUSH_VAPID_SUBJECT:mailto:no-reply@comandas.local}

############################
## Multipart Upload
############################
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ===============================
# EMAIL (SMTP)
# Username and password are required; set them empty to run without e-mail.
# ===============================
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Sender address of outgoing e-mail; defaults to the SMTP username.
mail.from=${MAIL_FROM:}

# ===============================
# GOOGLE SIGN-IN
# ===============================
# The platform runs the OAuth round trip (PLT-038) with GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET from the environment
# (both optional: without them the Google button is hidden). Nothing to configure here.

# Cloudflare Turnstile on the public auth routes (PLT-033, platform starter). Off until TURNSTILE_SITE_KEY and
# TURNSTILE_SECRET_KEY are both set in the environment.
turnstile.protected-paths=/auth/login,/auth/password-recovery/send

############################
## SSL (optional)
############################
# Enabled through the SERVER_SSL_* environment variables (see docker-compose.yml and .env.example).
