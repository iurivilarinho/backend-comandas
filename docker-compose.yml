# Own-instance deployment (CENTRAL_MODE=off): one database, schema public, no Central, no plan limits.
# The hosted deployment does not use this file (see aurora-platform/infra).
#
# Required variables come from the environment (a .env file next to this file, or the stack environment). Secrets have
# no default: compose refuses to start without them. See .env.example for the full list.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # git tag (v<version>) of aurora-platform the starter is built from; build with: docker compose build --ssh default
        PLATFORM_VERSION: ${PLATFORM_VERSION:-0.7.0}
      ssh:
        - default
    ports:
      - "9091:9091"
    network_mode: host
    environment:
      TZ: America/Sao_Paulo
      SPRING_PROFILES_ACTIVE: prod

      # Hosting platform: this file is the own instance
      CENTRAL_MODE: "off"

      # Database
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}

      # HTTP and CORS
      SERVER_PORT: ${SERVER_PORT:-9091}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      # TLS (the keystore file is mounted from the host, never stored in the repository)
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_KEY_STORE: "file:/etc/ssl/private/keystore.jks"
      SERVER_SSL_KEY_STORE_TYPE: "JKS"
      SERVER_SSL_KEY_STORE_PASSWORD: ${SERVER_SSL_KEY_STORE_PASSWORD:?SERVER_SSL_KEY_STORE_PASSWORD is required}
      SERVER_SSL_KEY_ALIAS: ${SERVER_SSL_KEY_ALIAS:-springboot}

      # JWT: one distinct random value (>= 32 characters) per instance
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}

      # Initial administrator (only used when no "admin" user exists yet)
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}

      # E-mail (set them, empty is allowed, to run without e-mail)
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-localhost}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      MAIL_FROM: ${MAIL_FROM:-}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME?SPRING_MAIL_USERNAME is required (may be empty)}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD?SPRING_MAIL_PASSWORD is required (may be empty)}

      # Google sign-in through the platform (optional; both blank hides the button)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

      # Web Push (VAPID). Blank keeps push disabled.
      PUSH_VAPID_PUBLIC_KEY: ${PUSH_VAPID_PUBLIC_KEY:-}
      PUSH_VAPID_PRIVATE_KEY: ${PUSH_VAPID_PRIVATE_KEY:-}
      PUSH_VAPID_SUBJECT: ${PUSH_VAPID_SUBJECT:-mailto:contato@comandas.local}
    volumes:
      - /etc/ssl/private/keystore.jks:/etc/ssl/private/keystore.jks:ro
    restart: unless-stopped
